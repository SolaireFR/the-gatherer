services:
  app:
    image: ghcr.io/solairefr/the-gatherer:1.0.0
    container_name: the-gatherer-app
    volumes:
      - /docker/volumes/the-gatherer:/app/data
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GNEWS_API_KEY=${GNEWS_API_KEY}
      - CURRENTS_API_KEY=${CURRENTS_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    restart: unless-stopped
    networks:
      - the-gatherer-network

networks:
  the-gatherer-network:
    name: the-gatherer-network
    driver: bridge
