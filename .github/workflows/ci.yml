name: Build and Push Docker Image

# Se déclenche à chaque push sur la branche principale (main ou master)
on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  # Convertit le nom du dépôt GitHub en minuscules pour l'image Docker
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Requis pour pousser l'image sur GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape indispensable pour éviter de re-télécharger Go/Docker en partant de zéro à chaque fois
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion automatique à GHCR en utilisant le token généré par GitHub pour ce build
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build l'image et la pousse avec le tag 'latest'
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Optimise la vitesse des builds suivants en mettant en cache les couches de l'image
          cache-from: type=gha
          cache-to: type=gha,mode=max