services:
  app:
    build: .
    container_name: the-gatherer-app
    ports:
      - "8800:8080"
    volumes:
      - ./data:/app/data
      - ./main.go:/app/main.go
      # Caches Go conservés à la racine du projet : les dépendances ne sont
      # téléchargées qu'une seule fois et la recompilation est quasi instantanée.
      - ./.gocache/mod:/go/pkg/mod
      - ./.gocache/build:/root/.cache/go-build
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GNEWS_API_KEY=${GNEWS_API_KEY}
      - CURRENTS_API_KEY=${CURRENTS_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SITE_PASSWORD=${SITE_PASSWORD}
    restart: unless-stopped
