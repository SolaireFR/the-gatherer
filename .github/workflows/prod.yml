name: Build and Push Prod Docker Image

on:
  push:
    branches:
      - prod

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Nom du depot en minuscules (contrainte GHCR)
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Tag au format <10 premiers caracteres du hash du commit>-prod
      - name: Compute image tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-10)
          echo "IMAGE_TAG=${SHORT_SHA}-prod" >> ${GITHUB_ENV}
          echo "Tag genere : ${SHORT_SHA}-prod"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
