services:
  app:
    image: ghcr.io/solairefr/the-gatherer:1.0.0
    container_name: the-gatherer-app
    volumes:
      # Image gosvelte (scratch) lancée en utilisateur 65532 : dossier à lui donner (chown -R 65532:65532)
      - /docker/volumes/the-gatherer:/app/data
    environment:
      # Port de l'ancienne image : proxy inverse inchangé (défaut gosvelte : 3333)
      - PORT=8080
      # News récupérées à minuit, heure de Paris (fuseaux embarqués dans le binaire)
      - TZ=Europe/Paris
      - PUBLIC_PROJECT_NAME=The Gatherer
      - DB_NAME=app_db
      - SQLITE_PATH=./data
      # Secrets : longs et aléatoires (openssl rand -base64 48), cf. .env.example
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SETTINGS_SECRET_KEY=${SETTINGS_SECRET_KEY}
      # Compte admin créé au premier démarrage (identifiant : admin)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Clé Mistral (ou /admin > Clés d'API, prioritaire dès qu'une clé y est enregistrée)
      - API_MISTRAL_KEYS=${API_MISTRAL_KEYS}
    restart: unless-stopped
    networks:
      - the-gatherer-network

networks:
  the-gatherer-network:
    name: the-gatherer-network
    driver: bridge
