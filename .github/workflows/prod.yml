name: Build and Push Prod Docker Image

on:
  push:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 24
  PNPM_VERSION: 12.11.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # gosvelte vient du depot prive SolaireFR/gosvelte : modules Go et gosvelte-front (GitHub Packages).
      # Secrets a creer dans le depot : GOSVELTE_TOKEN (fine-grained, Contents en lecture sur SolaireFR/gosvelte)
      # et GOSVELTE_NPM_TOKEN (classic, read:packages)
      GOPRIVATE: github.com/SolaireFR/*
      GOSVELTE_TOKEN: ${{ secrets.GOSVELTE_TOKEN }}
      GOSVELTE_NPM_TOKEN: ${{ secrets.GOSVELTE_NPM_TOKEN }}

    steps:
      # Secret vide = « Invalid username or token » au telechargement de gosvelte-core : erreur explicite des le debut
      - name: Check gosvelte secrets
        run: |
          for name in GOSVELTE_TOKEN GOSVELTE_NPM_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent : le creer dans Settings > Secrets and variables > Actions du depot (cf. README de gosvelte)"
              exit 1
            fi
          done

      # Versions sur Node 24 (Node 20 deprecie sur les runners), comme la CI de gosvelte
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # .env non versionne : sans lui, .gosvelte/generated/env.ts est vide et svelte-check echoue
      # (« env.ts is not a module ») ; valeurs publiques de .env.example, aucun secret
      - name: Create .env
        run: cp .env.example .env

      # Acces git au depot prive gosvelte (modules Go)
      - name: Access to gosvelte
        run: git config --global url."https://x-access-token:${GOSVELTE_TOKEN}@github.com/SolaireFR/".insteadOf "https://github.com/SolaireFR/"

      # Nom du depot en minuscules (contrainte GHCR) ; tag au format <10 premiers caracteres du hash du commit>-prod
      - name: Compute image name and tag
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-10)-prod" >> ${GITHUB_ENV}

      # svelte-check + go vet (commande gosvelte a la version de go.mod)
      - name: Check
        run: go tool gosvelte check

      - name: Test
        run: go test ./back/...

      # Image scratch : binaire Linux statique, front embarque (PUBLIC_* lues dans .env.example)
      - name: Build Docker image
        run: go tool gosvelte docker -t "${IMAGE}:${IMAGE_TAG}"

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"
          echo "Image publiee : ${IMAGE}:${IMAGE_TAG}"
