services:
  app:
    image: ghcr.io/solairefr/the-gatherer:1.0.0
    container_name: the-gatherer-app
    volumes:
      - /docker/volumes/the-gatherer:/app/data
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GNEWS_API_KEY=${GNEWS_API_KEY}
      - CURRENTS_API_KEY=${CURRENTS_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SITE_PASSWORD=${SITE_PASSWORD}
      - MISTRAL_API_URL=${MISTRAL_API_URL}
      - MISTRAL_MODEL=${MISTRAL_MODEL}
      - MISTRAL_TEMPERATURE=${MISTRAL_TEMPERATURE}
      - DEVTO_API_URL=${DEVTO_API_URL}
      - CURRENTS_API_URL=${CURRENTS_API_URL}
      - GNEWS_API_URL=${GNEWS_API_URL}
      - NEWSAPI_API_URL=${NEWSAPI_API_URL}
    restart: unless-stopped
    networks:
      - the-gatherer-network

networks:
  the-gatherer-network:
    name: the-gatherer-network
    driver: bridge
